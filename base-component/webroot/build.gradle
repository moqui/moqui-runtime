String getTargetPath(String sourcePath, String targetPath) {
    if (!targetPath) {
        String[] sourceSplit = sourcePath.split("/")
        targetPath = sourceSplit[0] + '/' + sourceSplit[2..sourceSplit.length-1].join('/')
    }
    return targetPath
}
task downloadFiles { doLast {
    for (Map.Entry fileEntry in fileMap.entrySet()) {
        String sourcePath = fileEntry.key
        String targetPath = getTargetPath(sourcePath, (String) fileEntry.value)

        File targetFile = file(libsPath + '/' + targetPath)
        if (targetFile.exists()) continue

        String sourceUrl = downloadBase + sourcePath
        logger.lifecycle("Downloading ${sourceUrl} to ${targetFile.absolutePath}")
        targetFile.getParentFile().mkdirs()
        ant.get(src: sourceUrl, dest: targetFile)
    }

    for (String jsdPath in jsdelivrList) {
        String[] sourceSplit = jsdPath.split("/")
        String libDir = sourceSplit[0].substring(0, sourceSplit[0].indexOf("@"))
        String targetPath = libDir + '/' + sourceSplit[sourceSplit.length-1]

        File targetFile = file(libsPath + '/' + targetPath)
        if (targetFile.exists()) continue

        String sourceUrl = jsdelivrBase + jsdPath
        logger.lifecycle("Downloading ${sourceUrl} to ${targetFile.absolutePath}")
        targetFile.getParentFile().mkdirs()
        ant.get(src: sourceUrl, dest: targetFile)
    }

    // CKEditor 4.14.1 (the build cdn.ckeditor.com/4.14.1/standard-all/ckeditor.js actually serves:
    // version string "4.14.1 (Standard)"). ckeditor.js then loads plugins, skin, and lang beside itself.
    // The npm package is that build plus those files. The old preset zip URL no longer exists.
    File ckeditorJs = file(libsPath + "/ckeditor/ckeditor.js")
    if (!ckeditorJs.exists()) {
        File tgz = file("${buildDir}/ckeditor4-4.14.1.tgz")
        tgz.getParentFile().mkdirs()
        String ckUrl = "https://registry.npmjs.org/ckeditor4/-/ckeditor4-4.14.1.tgz"
        logger.lifecycle("Downloading ${ckUrl}")
        ant.get(src: ckUrl, dest: tgz)
        File exploded = file("${buildDir}/ckeditor4-4.14.1")
        ant.untar(src: tgz, dest: exploded, compression: "gzip")
        File destDir = file(libsPath + "/ckeditor")
        ant.copy(todir: destDir) {
            fileset(dir: "${exploded}/package") {
                exclude(name: "samples/**")
                exclude(name: "adapters/**")
            }
        }
    }
} }

